# =============================================================================
# ImageServer - Product Interface Configuration
# =============================================================================

# =============================================================================
# LOGGING
# =============================================================================

logging:

  # Verzeichnis der Logdateien.
  directory: "/pecom/imgsrv/logs"

  # Gemeinsame Logdatei des Product Interface.
  filename: "product-interface.log"

  # Minimales Loglevel.
  level: "INFO"

  # Maximale Groesse einer Logdatei in MiB.
  max_size_mb: 10

  # Anzahl der zusaetzlich aufbewahrten Logdateien.
  backup_count: 5

  # Zusaetzliche Ausgabe der Logmeldungen auf der Konsole.
  console_output: true


# =============================================================================
# LOCAL SERVER
# =============================================================================

local:

  # IP-Adresse des lokalen Imageservers.
  ip: "10.28.128.118"

  # Benutzer fuer die Uebertragung der Antwortdateien.
  username: "pecom"

  # Empfangsverzeichnis fuer PIF- und SYD-Dateien.
  response_directory: "/pecom/imgsrv/pii/in"


# =============================================================================
# REMOTE PRODUCT SERVER
# =============================================================================

remote:

  ip: "10.28.128.48"
  username: "pecom"

  # Zielverzeichnis fuer Produktanforderungen.
  request_directory: "/pif/pii/t_proof"

  ssh_port: 22
  ssh_timeout: 10
  transfer_timeout: 30


# =============================================================================
# DIRECTORIES
# =============================================================================

directories:

  # Verzeichnis der PIF- und SYC-Anforderungsvorlagen.
  templates: "/pecom/imgsrv/pii/out"

  # Verzeichnis fuer temporaer erzeugte Anforderungsdateien.
  temporary: "/pecom/imgsrv/pii/tmp"

  # Verzeichnis fuer fehlerhafte Antwortdateien.
  error: "/pecom/imgsrv/pii/error"

  # Verzeichnis fuer ausgewertete Produktdaten.
  products: "/pecom/imgsrv/products"


# =============================================================================
# PRODUCT LIST REQUEST
# =============================================================================

product_list:

  # Vorlage fuer die Produktlistenanforderung.
  request_file: "pii000.pif"

  # Erwarteter Dateiname der Produktliste.
  response_file: "piiprdlst.pif"

  # Produktionszeitraum relativ zum aktuellen Datum.
  days_backward: 2
  days_forward: 2


# =============================================================================
# POLLING
# =============================================================================

polling:

  # Wartezeit zwischen zwei vollstaendigen Abfragezyklen.
  interval_seconds: 60

  # Maximale Wartezeit auf eine Antwort des Produktservers.
  response_timeout_seconds: 30

  # Intervall fuer die Pruefung auf eingegangene Antworten.
  response_poll_interval_seconds: 1


# =============================================================================
# PRODUCT CACHE
# =============================================================================
# Speichert den letzten erfolgreich verarbeiteten Stand
# der einzelnen Produkte.
#
# Produktdetails werden nur fuer neue oder geaenderte
# Produkte angefordert.
# =============================================================================

product_cache:

  # Dateiname des persistenten Produktcaches.
  filename: "/pecom/imgsrv/products/product_cache.json"


# =============================================================================
# PRODUCT DETAILS REQUEST
# =============================================================================

product_details:

  # Originalvorlage fuer Produktdetailanforderungen.
  template_file: "pii001.pif"

  # Praefix fuer erzeugte Anforderungsdateien.
  request_prefix: "piireq"

  # Praefix fuer erwartete Antwortdateien.
  response_prefix: "piians"

  # Dateiendung der Anforderungs- und Antwortdateien.
  file_extension: ".pif"


# =============================================================================
# JOB CREATION
# =============================================================================
# Identische Bildrezepte werden zu einem Auftrag zusammengefasst.
# Ein Auftrag kann mehrere Composite-Dateinamen enthalten.
#
# Das Product Interface ist ausschliesslich fuer die Erzeugung
# der Auftragsdateien verantwortlich.
#
# Die Verarbeitung und Verwaltung der Auftraege erfolgt
# unabhaengig davon durch den Imageserver.
# =============================================================================

job_creation:

  # Automatische Erzeugung von Bildauftraegen aktivieren.
  enabled: true

  # Zielverzeichnis fuer neu erzeugte Bildauftraege.
  # Muss mit jobs.pending in imageserver.yaml uebereinstimmen.
  output_directory: "/pecom/imgsrv/jobs/pending"
