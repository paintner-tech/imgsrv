# ImageServer - zentrale Konfiguration
# Alle relativen Pfade beziehen sich auf [server] root_dir.

[server]
root_dir = /pecom/imgsrv
log_level = DEBUG

[paths]
tiff_in = tiffs-in
tiff_done = tiffs-done
separation_png = pngs
composite_png = composites
logs = logs

[filenames]
# 0-basiert; -1 = letztes Zeichen vor der Dateiendung
color_position = -1
cyan = C
magenta = M
yellow = Y
black = K
extensions = .tif, .tiff

[watcher]
scan_interval_seconds = 5
# Wartezeit seit der letzten Aenderung vor Verarbeitung
file_stable_seconds = 15

[processing]
# Auswahl nach Naehe zur TIFF-Aufloesung (dpi)
dpi_tolerance = 100
# Format: dpi, factor, algorithm, join, B, C, D
# Algorithmus 2 des alten Servers wird erst spaeter nachgebildet.
dpi_config_1 = 1200, 16, 2, 4, 0, 0, 0
dpi_config_2 = 2400, 32, 2, 8, 0, 0, 0
# Vorlaeufiger Entrasterer: block_mean (nicht identisch mit Alt-Algorithmus 2)
descreen_method = block_mean

[composite]
output_format = png
output_mode = RGB
icc_enabled = false
simulate_paper_color = false
max_width = 1440
max_height = 2560

[retention]
# h = Stunden; d = Tage; 0 = automatische Loeschung deaktiviert
# Nur bereits erfolgreich verarbeitete TIFF-Dateien loeschen.
# Unverarbeitete TIFFs im Eingangsordner
tiff_in = 7d
# Erfolgreich verarbeitete TIFFs
tiff_done = 2d
separation_png = 48h
composite_png = 2d
# Reinigungsintervall
cleanup_interval = 1h

[LOGGING]
config_loader = logs/config_loader.log
imageserver = logs/imageserver.log
folder_watcher = logs/folder_watcher.log
tiff_processor = logs/tiff_processor.log
composite = logs/composite.log
cleanup = logs/cleanup.log
